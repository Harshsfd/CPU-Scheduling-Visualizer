<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPU Scheduling Simulator</title>

  <!-- Bootstrap -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary justify-content-between">
    <span class="navbar-brand mb-0 h3">⚙️ CPU Scheduling Algorithms</span>
    <button id="toggleTheme" class="btn btn-sm btn-light">🌙 Dark Mode</button>
  </nav>

  <div class="container my-4">
    <!-- Algorithm Selection -->
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h5 class="card-title">Parameters</h5>
        <div class="form-group">
          <label for="algorithmSelector"><b>Select Scheduling Method</b></label>
          <select class="form-control" id="algorithmSelector">
            <option value="optFCFS">First Come First Served (FCFS)</option>
            <option value="optSJF">Shortest Job First (SJF)</option>
            <option value="optSRTF">Shortest Remaining Time First (SRTF)</option>
            <option value="optRR">Round Robin (RR)</option>
          </select>
        </div>
        <div class="form-group form-group-time-quantum">
          <label>Time Quantum (for RR only):</label>
          <input class="form-control" type="number" min="1" max="10" id="timeQuantum" placeholder="e.g. 2">
        </div>
      </div>
    </div>

    <!-- Process List -->
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h5 class="card-title">Process Input</h5>
        <div class="row mb-2">
          <div class="col"><input class="form-control" type="number" min="0" id="processID" placeholder="Process ID"></div>
          <div class="col"><input class="form-control" type="number" min="0" id="arrivalTime" placeholder="Arrival Time"></div>
          <div class="col"><input class="form-control" type="number" min="1" id="burstTime" placeholder="Burst Time"></div>
          <div class="col">
            <button class="btn btn-success btn-block" id="btnAddProcess"><i class="fa fa-plus"></i> Add</button>
          </div>
          <div class="col">
            <button class="btn btn-secondary btn-block" id="resetBtn">🔄 Reset</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered" id="tblProcessList">
            <thead class="thead-dark">
              <tr>
                <th>Process ID</th>
                <th>Arrival Time</th>
                <th>Burst Time</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- Process rows will be injected here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h5 class="card-title">Results</h5>
        <div class="table-responsive">
          <table class="table table-bordered" id="tblResults">
            <thead class="thead-dark">
              <tr>
                <th>Process ID</th>
                <th>Arrival Time</th>
                <th>Burst Time</th>
                <th>Completion Time</th>
                <th>Waiting Time</th>
                <th>Turnaround Time</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- Metrics -->
        <div class="row mt-3">
          <div class="col-md-4">
            <label>Average Turnaround Time</label>
            <input class="form-control" id="avgTurnaroundTime" type="text" placeholder="0" disabled>
          </div>
          <div class="col-md-4">
            <label>Average Waiting Time</label>
            <input class="form-control" id="avgWaitingTime" type="text" placeholder="0" disabled>
          </div>
          <div class="col-md-4">
            <label>Throughput</label>
            <input class="form-control" id="throughput" type="text" placeholder="0" disabled>
          </div>
        </div>
      </div>
    </div>

    <!-- Gantt Chart -->
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h5 class="card-title text-center">📊 Gantt Chart</h5>
        <div id="ganttChart" class="d-flex flex-wrap justify-content-center p-2"></div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="mb-4">
      <button class="btn btn-primary btn-block" id="btnCalculate">🚀 Calculate</button>
      <div class="text-center mt-2">
        <button class="btn btn-outline-success btn-sm" id="btnExportCSV"><i class="fa fa-file-csv"></i> Export CSV</button>
        <button class="btn btn-outline-danger btn-sm" id="btnExportPDF"><i class="fa fa-file-pdf"></i> Export PDF</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="page-footer bg-dark p-3 mt-5">
    <div class="text-center text-white">
      Operating Systems Project by: <a href="https://www.linkedin.com/in/harshsfd" target="_blank">HARSHSFD</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
