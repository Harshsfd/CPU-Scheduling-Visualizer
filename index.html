<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS Project</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
    crossorigin="anonymous">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to bottom right, #3498db, #2c3e50);
      font-family: 'Nunito', sans-serif;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.3);
    }

    #logo {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    h1 {
      font-weight: 700;
      font-size: 2.2rem;
      margin-top: 20px;
      margin-bottom: 30px;
      text-align: center;
      color: black;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    table {
      width: 100%;
      background-color: #3498db;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    table td,
    table th {
      padding: 10px;
      text-align: center;
      font-size: 1rem;
      color: #fff;
    }

    table th {
      background-color: #2980b9;
      font-weight: 700;
    }

    .btn-primary {
      background-color: #27ae60;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn-primary:hover {
      background-color: #219653;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: #fff;
    }

    footer a {
      text-decoration: none;
      color: #fff;
    }

    footer a:hover {
      text-decoration: underline;
      color: #ffffff;
    }

    @media (max-width: 576px) {
      h1 {
        font-size: 1.8rem;
      }

      table td,
      table th {
        font-size: 0.9rem;
        padding: 8px;
      }

      .btn-primary {
        font-size: 0.9rem;
        padding: 8px 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="main/Siet_logo.PNG" id="logo" alt="logo">

    <h1>OS Scheduling Algorithms</h1>

    <div class="table-responsive">
      <table class="table table-bordered mb-4">
        <thead>
          <tr>
            <th>Name</th>
            <th>Group No.</th>
            <th>College Roll No.</th>
            <th>University Roll No.</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Harsh Bhardwaj</td>
            <td>6TH</td>
            <td>87225106</td>
            <td>2021217473</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="text-center">
      <button class="btn btn-primary" onclick="window.location='main/main.html'">Click Here to Proceed</button>
    </div>
  </div>

  <footer>
    <a href="#" target="_blank">
      <h4>HARSHSFD</h4>
    </a>
  </footer>

</body>

</html>
