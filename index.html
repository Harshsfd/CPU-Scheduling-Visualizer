<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS Project</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
    crossorigin="anonymous">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to bottom right, #3498db, #2c3e50);
      font-family: 'Nunito', sans-serif;
      color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 900px;
      width: 95%;
      margin: 40px auto;
      padding: 25px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0px 4px 25px rgba(0, 0, 0, 0.3);
    }

    #logo {
      max-width: 160px;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    h1 {
      font-weight: 700;
      font-size: 2.2rem;
      margin: 20px 0 30px;
      text-align: center;
      color: #222;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.15);
    }

    table {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    table td,
    table th {
      padding: 12px;
      text-align: center;
      font-size: 1rem;
      color: #fff;
    }

    table th {
      background-color: #2980b9;
      font-weight: 700;
    }

    table td {
      background-color: #3498db;
    }

    .btn-primary {
      background-color: #27ae60;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: 0.3s ease-in-out;
    }

    .btn-primary:hover {
      background-color: #219653;
      transform: scale(1.05);
    }

    footer {
      margin-top: auto;
      padding: 20px 10px;
      text-align: center;
      color: #fff;
    }

    footer a {
      text-decoration: none;
      color: #fff;
    }

    footer a:hover {
      text-decoration: underline;
      color: #f1f1f1;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
      }

      table td,
      table th {
        font-size: 0.9rem;
        padding: 8px;
      }

      .btn-primary {
        font-size: 0.9rem;
        padding: 10px 20px;
      }

      #logo {
        max-width: 120px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }

      h1 {
        font-size: 1.5rem;
      }

      table td,
      table th {
        font-size: 0.85rem;
        padding: 6px;
      }

      .btn-primary {
        font-size: 0.85rem;
        padding: 8px 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="main/Siet_logo.PNG" id="logo" alt="logo">

    <h1>OS Scheduling Algorithms</h1>

    <div class="table-responsive">
      <table class="table table-bordered mb-4">
        <thead>
          <tr>
            <th>Name</th>
            <th>Group No.</th>
            <th>College Roll No.</th>
            <th>University Roll No.</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Harsh Bhardwaj</td>
            <td>6th</td>
            <td>87225106</td>
            <td>2021217473</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="text-center">
      <button class="btn btn-primary" onclick="window.location='main/main.html'">Click Here to Proceed</button>
    </div>
  </div>

  <footer>
    <a href="https://www.linkedin.com/in/harshsfd" target="_blank">
      <h4>HARSHSFD</h4>
    </a>
  </footer>

</body>
</html>
