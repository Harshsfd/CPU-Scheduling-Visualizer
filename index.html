<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OS Project — CPU Scheduling</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#0ea5e9; /* sky-500 */
      --bg2:#0f172a; /* slate-900 */
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --brand:#2563eb;
      --brand-2:#22c55e;
    }
    *{box-sizing:border-box}
    body{
      min-height:100vh;
      margin:0;
      font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, rgba(34,197,94,.25), transparent 60%),
                  radial-gradient(1200px 600px at 110% 10%, rgba(37,99,235,.25), transparent 60%),
                  linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
    }
    .card{
      max-width: 980px;
      width: 96%;
      border: 0;
      border-radius: 1.25rem;
      box-shadow: 0 25px 60px rgba(2,6,23,.45);
      overflow:hidden;
    }
    .hero{
      background: linear-gradient(120deg, rgba(37,99,235,.12), rgba(34,197,94,.12));
      padding: 2.25rem;
    }
    .logo{
      width: 110px;
      height: 110px;
      border-radius: 18px;
      background: #fff;
      display:grid;
      place-items:center;
      box-shadow: inset 0 0 0 6px rgba(37,99,235,.08);
    }
    .logo img{ width:82px; height:auto;}
    .title{
      color: var(--text);
      font-weight: 800;
      letter-spacing: .2px;
    }
    .lead{
      color: var(--muted);
      font-weight:600;
    }
    .table thead th{background:#0ea5e9;color:#fff;border:0}
    .table tbody td{background:#38bdf8;color:#06223b;border:0}
    .btn-brand{
      background:linear-gradient(135deg,var(--brand),#1d4ed8);
      border:none;
      padding:.9rem 1.4rem;
      border-radius:.9rem;
      font-weight:800;
      letter-spacing:.3px;
      transition: transform .18s ease, filter .18s ease;
      box-shadow: 0 12px 24px rgba(29,78,216,.35);
    }
    .btn-brand:hover{ transform: translateY(-2px); filter:brightness(1.05);}
    footer a{ color:#e2e8f0; text-decoration:none; font-weight:700}
    footer a:hover{ text-decoration:underline }
    @media (max-width:576px){
      .hero{padding:1.25rem}
      .title{font-size:1.6rem}
    }
  </style>
</head>
<body>
  <div class="card bg-white">
    <div class="hero d-flex align-items-center gap-3">
      <div class="logo me-3">
        <img src="main/Siet_logo.svg" alt="Institute Logo">
      </div>
      <div>
        <h1 class="title mb-1">OS Scheduling Algorithms</h1>
        <p class="lead mb-0">Interactive simulator for FCFS, SJF, SRTF & Round Robin with Gantt chart</p>
      </div>
    </div>

    <div class="p-4 p-md-5">
      <div class="table-responsive mb-4">
        <table class="table table-bordered align-middle mb-0">
          <thead>
            <tr>
              <th>Name</th>
              <th>Group No.</th>
              <th>College Roll No.</th>
              <th>University Roll No.</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Harsh Bhardwaj</td>
              <td>6th</td>
              <td>87225106</td>
              <td>2021217473</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="text-center">
        <a class="btn btn-brand btn-lg px-4" href="main/main.html">Proceed to Simulator</a>
      </div>
    </div>

    <footer class="bg-dark text-center py-3">
      <a href="https://www.linkedin.com/in/harshsfd" target="_blank" rel="noreferrer">HARSHSFD</a>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
